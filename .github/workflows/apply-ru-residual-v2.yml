name: Apply reviewed Russian residual map

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.run-apply-ru-residual-v2'

permissions:
  contents: write

concurrency:
  group: pptist-apply-ru-residual-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require one-shot trigger
        run: test -f .run-apply-ru-residual-v2

      - name: Load trusted applier from main
        shell: bash
        run: |
          git fetch origin main
          mkdir -p /tmp/pptist-localization
          git show origin/main:tools/localization/apply_ru_residual.py > /tmp/pptist-localization/apply_ru_residual.py

      - name: Apply reviewed translations and audit residual
        run: python /tmp/pptist-localization/apply_ru_residual.py --root . --map .localization/ru-residual-reviewed.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Production build
        run: npm run build-only -- --base=/PPTist/

      - name: Type check
        run: npm run type-check

      - name: Commit second Russianization pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .run-apply-ru-residual-v2 .run-generate-auto-ru-map
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No localization changes generated'
            exit 0
          fi
          git commit -m "feat: complete second Russian UI localization pass"
          git push origin HEAD:${{ github.head_ref }}
