name: Generate reviewed Russian residual map

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.run-generate-auto-ru-map'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install translation helper
        run: python -m pip install --disable-pip-version-check deep-translator==1.11.4

      - name: Translate residual dictionary to Russian draft
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from deep_translator import GoogleTranslator
          import json, re, time

          src = json.loads(Path('.localization/residual-unique.json').read_text(encoding='utf-8'))
          items = [item['text'] for item in src['items']]
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          protect_rx = re.compile(r'(\$\{[^{}]*\}|\{\{.*?\}\}|<[^>]+>|\b(?:PPTX?|JSON|SVG|LaTeX|AIGC|AI|API|Ctrl|Shift|ESC|Space|PgUp|PgDown|pexels\.com|markdown)\b)', re.I)

          translator = GoogleTranslator(source='zh-CN', target='ru')
          result = {}
          errors = {}

          def protect(text):
              tokens = []
              def repl(m):
                  token = f'ZXQPH{len(tokens)}QXZ'
                  tokens.append((token, m.group(0)))
                  return token
              return protect_rx.sub(repl, text), tokens

          def restore(text, tokens):
              for token, original in tokens:
                  text = text.replace(token, original)
                  text = text.replace(token.lower(), original)
              return text

          for idx, text in enumerate(items, 1):
              if not han.search(text):
                  continue
              protected, tokens = protect(text)
              translated = None
              last_error = None
              for attempt in range(3):
                  try:
                      translated = translator.translate(protected)
                      break
                  except Exception as exc:
                      last_error = repr(exc)
                      time.sleep(1.5 * (attempt + 1))
              if translated is None:
                  errors[text] = last_error or 'unknown error'
                  continue
              translated = restore(translated, tokens).strip()
              result[text] = translated
              if idx % 50 == 0:
                  print(f'Translated {idx}/{len(items)}')
                  time.sleep(0.5)

          # Known product/UI terminology overrides. These are deliberately explicit and
          # override machine wording before the map is ever applied to source code.
          overrides = {
              '搜索': 'Поиск',
              '加载中...': 'Загрузка...',
              '全屏': 'Полный экран',
              '关': 'Выкл.',
              '开': 'Вкл.',
              '通用': 'Общие',
              '内容': 'Содержимое',
              '封面': 'Обложка',
              '目录': 'Содержание',
              '过渡': 'Переход',
              '结束': 'Завершение',
              '确定': 'ОК',
              '确认': 'Подтвердить',
              '移除': 'Удалить',
              '插入': 'Вставить',
              '加粗': 'Полужирный',
              '斜体': 'Курсив',
              '下划线': 'Подчёркивание',
              '删除线': 'Зачёркивание',
              '行内代码': 'Встроенный код',
              '观众视图': 'Режим аудитории',
              '未命名演示文稿': 'Презентация без названия',
              '测试用户': 'Тестовый пользователь',
              '中文': 'Китайский',
              '英文': 'Английский',
              '日文': 'Японский',
              '日本語': 'Японский',
              '微软雅黑': 'Microsoft YaHei',
              '思源黑体': 'Source Han Sans',
              '思源宋体': 'Source Han Serif',
              '文鼎PL楷体': 'WenDing PL KaiTi',
              '文鼎PL宋体': 'WenDing PL SongTi',
              '朱雀仿宋': 'ZhuQue FangSong',
              '霞鹜文楷': 'LXGW WenKai',
              '霞鹜新致宋': 'LXGW Neo ZhiSong',
              '霞鹜新晰黑': 'LXGW Neo XiHei',
              '阿里巴巴普惠体': 'Alibaba PuHuiTi',
              '得意黑': 'DeYiHei',
              '默认字体': 'Шрифт по умолчанию',
              'AI搜图': 'Поиск изображений с AI',
              'AI生图': 'Генерация изображений с AI',
              'AI辅助': 'AI-помощник',
              '标准版': 'Стандартный',
              '纯图版': 'Только изображения',
          }
          for key, value in overrides.items():
              if key in result or key in items:
                  result[key] = value

          payload = {
              'stats': {
                  'source_candidates': len(items),
                  'translated': len(result),
                  'errors': len(errors),
              },
              'translations': dict(sorted(result.items())),
              'errors': errors,
          }
          Path('.localization/ru-residual-draft.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload['stats'], ensure_ascii=False, indent=2))
          PY

      - name: Commit draft map and remove trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .run-generate-auto-ru-map
          git add .localization/ru-residual-draft.json .run-generate-auto-ru-map
          git commit -m "chore: generate Russian residual translation draft"
          git push origin HEAD:${{ github.head_ref }}
