name: Review Russian residual map

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.run-review-ru-map'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install fallback translator
        run: python -m pip install --disable-pip-version-check deep-translator==1.11.4

      - name: Validate, repair and polish Russian map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from deep_translator import GoogleTranslator
          import json, re, time

          fast = json.loads(Path('.localization/ru-residual-draft-fast.json').read_text(encoding='utf-8'))['translations']
          residual = json.loads(Path('.localization/residual-unique.json').read_text(encoding='utf-8'))
          sources = [item['text'] for item in residual['items']]
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          placeholder_rx = re.compile(r'\$\{[^{}]*\}|\{\{.*?\}\}')
          tag_rx = re.compile(r'<[^>]+>')
          protect_rx = re.compile(r'(\$\{[^{}]*\}|\{\{.*?\}\}|<[^>]+>|\b(?:PPTX?|JSON|SVG|LaTeX|AIGC|AI|API|Ctrl|Shift|ESC|Space|PgUp|PgDown|pexels\.com|markdown)\b)', re.I)

          def signature(rx, text):
              return [x.strip() for x in rx.findall(text)]

          def valid(source, target):
              if not target or '\n' in target or '\r' in target or han.search(target):
                  return False
              if signature(placeholder_rx, source) != signature(placeholder_rx, target):
                  return False
              # If source contains actual markup, require the same tag multiset/order.
              if tag_rx.search(source) and signature(tag_rx, source) != signature(tag_rx, target):
                  return False
              # Obvious batching marker leakage.
              if 'ZXQID' in target or 'ZXQPH' in target:
                  return False
              return True

          def protect(text):
              tokens = []
              def repl(m):
                  token = f'ZXQSAFE{len(tokens)}QXZ'
                  tokens.append((token, m.group(0)))
                  return token
              return protect_rx.sub(repl, text), tokens

          def restore(text, tokens):
              for token, original in tokens:
                  for variant in (token, token.lower(), token.upper(), token.capitalize()):
                      text = text.replace(variant, original)
              return text

