            '滑出':'Выезд','向下滑出':'Выезд вниз','从左滑出':'Выезд влево','从右滑出':'Выезд вправо','向上滑出':'Выезд вверх',
            'X轴翻转退出':'Исчезновение с переворотом по X','Y轴翻转退出':'Исчезновение с переворотом по Y',
            '缩小滑出':'Исчезновение с масштабированием','向下缩小滑出':'Масштабирование вниз','从左缩小滑出':'Масштабирование влево','从右缩小滑出':'Масштабирование вправо','向上缩小滑出':'Масштабирование вверх',
            '飞出':'Быстрое исчезновение','从右飞出':'Быстрое исчезновение вправо','从左飞出':'Быстрое исчезновение влево',
            # Attention animations
            '晃动':'Колебания','左右摇晃':'Горизонтальная тряска','上下摇晃':'Вертикальная тряска','摇头':'Покачивание головой','摆动':'Качание','惊恐':'Та-дам','果冻':'Желе',
            '其他':'Другие','闪烁':'Мигание','脉搏':'Пульсация','橡皮筋':'Резинка','心跳（快）':'Сердцебиение',
          }

          translator = GoogleTranslator(source='zh-CN', target='ru')
          reviewed = {}
          repaired = {}
          invalid = []

          for idx, source in enumerate(sources, 1):
              if source in overrides:
                  reviewed[source] = overrides[source]
                  continue
              target = fast.get(source, '')
              if valid(source, target):
                  reviewed[source] = target.strip()
                  continue
              invalid.append(source)

          # Re-translate only broken batched entries one by one.
          for pos, source in enumerate(invalid, 1):
              protected, tokens = protect(source)
              translated = None
              error = None
              for attempt in range(4):
                  try:
                      translated = translator.translate(protected)
                      break
                  except Exception as exc:
                      error = repr(exc)
                      time.sleep(1.5 * (attempt + 1))
              if translated is None:
                  repaired[source] = {'error': error or 'translation failed'}
                  continue
              translated = restore(translated, tokens).strip()
              if valid(source, translated):
                  reviewed[source] = translated
                  repaired[source] = {'translation': translated}
              else:
                  repaired[source] = {'error': 'fallback remained invalid', 'translation': translated}
              if pos % 20 == 0:
                  print(f'Repaired {pos}/{len(invalid)}')

          remaining = [s for s in sources if s not in reviewed]
          payload = {
              'stats': {
                  'source_candidates': len(sources),
                  'manual_overrides': sum(1 for s in sources if s in overrides),
                  'invalid_fast_entries': len(invalid),
                  'reviewed_translations': len(reviewed),
                  'remaining': len(remaining),
              },
              'translations': dict(sorted(reviewed.items())),
              'repair_details': repaired,
              'remaining': remaining,
          }
          Path('.localization/ru-residual-reviewed.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload['stats'], ensure_ascii=False, indent=2))
          PY

      - name: Commit reviewed map and remove trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .run-review-ru-map
