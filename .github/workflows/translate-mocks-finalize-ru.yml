name: Translate shipped demos and finalize Russian PPTist

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.run-translate-mocks-final'

permissions:
  contents: write

concurrency:
  group: pptist-final-russianization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Russian localization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require one-shot trigger
        run: test -f .run-translate-mocks-final

      - name: Load trusted localization tools from main
        shell: bash
        run: |
          git fetch origin main
          mkdir -p /tmp/pptist-localization
          git show origin/main:tools/localization/final_visible_cleanup.py > /tmp/pptist-localization/final_visible_cleanup.py
          git show origin/main:tools/localization/translate_mock_json.py > /tmp/pptist-localization/translate_mock_json.py

      - name: Apply final visible UI fixes and validate source
        run: python /tmp/pptist-localization/final_visible_cleanup.py

      - name: Verify ECharts is explicitly wired to Russian locale
        shell: bash
        run: |
          grep -q "import { ECHARTS_RU_LOCALE }" src/views/components/element/ChartElement/Chart.vue
          grep -q "locale: ECHARTS_RU_LOCALE" src/views/components/element/ChartElement/Chart.vue
          grep -q "Январь" src/views/components/element/ChartElement/echartsLocaleRU.ts
          echo "ECharts Russian locale wiring verified"

      - name: Install mock translation helper
        run: python -m pip install --disable-pip-version-check deep-translator==1.11.4

      - name: Translate shipped demo and mock JSON content
        run: python /tmp/pptist-localization/translate_mock_json.py

      - name: Verify all shipped public text assets are Russian
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          textual = {'.json', '.md', '.html', '.txt', '.svg', '.xml', '.css', '.js'}
          hits = []
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in textual:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              match = han.search(text)
              if match:
                  hits.append({
                      'file': str(path),
                      'sample': text[max(0, match.start() - 100):match.start() + 320],
                  })
          Path('.localization/final-public-han-audit.json').write_text(
              json.dumps({'count': len(hits), 'hits': hits}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if hits:
              print(json.dumps(hits[:20], ensure_ascii=False, indent=2))
              raise SystemExit(f'Chinese text remains in {len(hits)} shipped public text files')
          print('All shipped public text assets contain zero Chinese Han text')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Production build
        run: npm run build-only -- --base=/PPTist/

      - name: Type check
        run: npm run type-check

      - name: Verify built user-facing static assets contain zero Chinese Han text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          strict_exts = {'.css', '.html', '.json', '.svg', '.txt', '.xml', '.md'}
          user_hits = []
          vendor_js = []

          # Every non-JS textual asset must be completely clean. Application source has
          # already passed the stateful source audit, while ECharts is explicitly given
          # our Russian locale object. Chinese text remaining inside the minified JS is
          # therefore recorded as bundled vendor locale/data, not treated as active UI.
          for path in Path('dist').rglob('*'):
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              if suffix not in strict_exts and suffix != '.js':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              match = han.search(text)
              if not match:
                  continue
              item = {
                  'file': str(path),
                  'sample': text[max(0, match.start() - 120):match.start() + 360],
              }
              if suffix == '.js':
                  vendor_js.append(item)
              else:
                  user_hits.append(item)

          payload = {
              'user_facing_static_han_files': len(user_hits),
              'user_facing_hits': user_hits,
              'bundled_vendor_js_han_files': len(vendor_js),
              'vendor_js_samples': vendor_js[:10],
              'echarts_runtime_locale': 'RU explicit locale object',
          }
          Path('.localization/final-dist-han-audit.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          if user_hits:
              print(json.dumps(user_hits[:20], ensure_ascii=False, indent=2))
              raise SystemExit(f'Built static bundle still contains Chinese text in {len(user_hits)} user-facing files')

          print(
              'Built user-facing static assets contain zero Chinese Han text; '
              f'vendor JS files containing inactive bundled locale/data: {len(vendor_js)}'
          )
          PY

      - name: Record final localization status
        shell: bash
        run: |
          cat > .localization/FINAL-RU-STATUS.md <<'EOF'
          # PPTist Russian localization status

          - User-facing source UI: Russian; Chinese Han remains only in developer comments.
          - Shipped `public` textual assets: zero Chinese Han text.
          - Shipped demo/template/AI JSON and Markdown content: translated to Russian.
          - ECharts runtime: explicitly initialized with the Russian locale object.
          - Production Vite build: passed.
          - Vue/TypeScript type-check: passed.
          - Built non-JS user-facing textual assets: zero Chinese Han text.
          - ECharts may still physically bundle its unused Chinese locale dictionary and CJK width probe inside vendor JavaScript; runtime charts use the explicit Russian locale.
          EOF

      - name: Commit final validated Russian build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .run-translate-mocks-final
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No final localization changes to commit'
            exit 0
          fi
          git commit -m "feat: complete Russian PPTist localization including shipped demos"
          git push origin HEAD:${{ github.head_ref }}
