name: Translate shipped demos and finalize Russian PPTist

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.run-translate-mocks-final'

permissions:
  contents: write

concurrency:
  group: pptist-final-russianization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Russian localization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require one-shot trigger
        run: test -f .run-translate-mocks-final

      - name: Load trusted localization tools from main
        shell: bash
        run: |
          git fetch origin main
          mkdir -p /tmp/pptist-localization
          git show origin/main:tools/localization/final_visible_cleanup.py > /tmp/pptist-localization/final_visible_cleanup.py
          git show origin/main:tools/localization/translate_mock_json.py > /tmp/pptist-localization/translate_mock_json.py

      - name: Apply final visible UI fixes and validate source
        run: python /tmp/pptist-localization/final_visible_cleanup.py

      - name: Install mock translation helper
        run: python -m pip install --disable-pip-version-check deep-translator==1.11.4

      - name: Translate shipped demo and mock JSON content
        run: python /tmp/pptist-localization/translate_mock_json.py

      - name: Verify shipped Markdown demos are Russian
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          hits = []
          for path in Path('public/mocks').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              if han.search(text):
                  hits.append(str(path))
          if hits:
              raise SystemExit('Chinese text remains in shipped Markdown demos: ' + ', '.join(hits))
          print('Shipped Markdown demos contain zero Chinese Han text')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Production build
        run: npm run build-only -- --base=/PPTist/

      - name: Type check
        run: npm run type-check

      - name: Verify shipped bundle contains zero user-facing Chinese Han text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          wide_char_probe = re.compile(r'''measureText\(\s*["']国["']\s*,?''')
          hits = []
          technical_whitelist = []
          textual = {'.js', '.css', '.html', '.json', '.svg', '.txt', '.xml', '.md'}

          for path in Path('dist').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in textual:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for match in han.finditer(text):
                  context = text[max(0, match.start() - 80):min(len(text), match.end() + 100)]
                  # zrender/ECharts uses 国 only as a representative wide glyph in
                  # measureText() to estimate CJK character width. It is an internal
                  # numerical probe, never rendered as user-facing text.
                  if match.group(0) == '国' and path.suffix.lower() == '.js' and wide_char_probe.search(context):
                      technical_whitelist.append({
                          'file': str(path),
                          'character': '国',
                          'reason': 'ECharts/zrender internal wide-character measureText probe',
                      })
                      continue
                  hits.append({
                      'file': str(path),
                      'sample': text[max(0, match.start() - 120):min(len(text), match.start() + 360)],
                  })
                  break

          payload = {
              'user_facing_han_files': len(hits),
              'hits': hits,
              'technical_whitelist': technical_whitelist,
          }
          Path('.localization/final-dist-han-audit.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          if hits:
              print(json.dumps(hits[:20], ensure_ascii=False, indent=2))
              raise SystemExit(f'Built bundle still contains Chinese Han text in {len(hits)} user-facing textual files')

          print(f'Built PPTist bundle contains zero user-facing Chinese Han text; technical dependency probes: {len(technical_whitelist)}')
          PY

      - name: Record final localization status
        shell: bash
        run: |
          cat > .localization/FINAL-RU-STATUS.md <<'EOF'
          # PPTist Russian localization status

          - User-facing source UI: Russian; Chinese Han remains only in developer comments.
          - Shipped `public/mocks` JSON demo/template/AI content: translated to Russian.
          - Shipped Markdown demo outline: translated to Russian.
          - Production Vite build: passed.
          - Vue/TypeScript type-check: passed.
          - Built textual `dist`: zero user-facing Chinese Han text.
          - Allowed technical exception: the ECharts/zrender `measureText("国")` wide-character width probe; it is internal and is never rendered to the user.
          EOF

      - name: Commit final validated Russian build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .run-translate-mocks-final
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No final localization changes to commit'
            exit 0
          fi
          git commit -m "feat: complete Russian PPTist localization including shipped demos"
          git push origin HEAD:${{ github.head_ref }}
