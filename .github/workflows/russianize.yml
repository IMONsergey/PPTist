name: Russianize PPTist UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.russianize-trigger'

permissions:
  contents: write

jobs:
  russianize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Russian localization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch maintained PPTist i18n donor
        run: git clone --depth 1 https://github.com/robbin2012/PPTist-i18n.git /tmp/pptist-i18n

      - name: Apply exact donor translations without substring replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          donor = Path('/tmp/pptist-i18n/src/locales')
          zh = json.loads((donor / 'zh-CN.json').read_text(encoding='utf-8'))
          en = json.loads((donor / 'en-US.json').read_text(encoding='utf-8'))
          ru = json.loads((donor / 'ru-RU.json').read_text(encoding='utf-8'))

          def flatten(value, prefix=''):
              out = {}
              if isinstance(value, dict):
                  for k, v in value.items():
                      key = f'{prefix}.{k}' if prefix else k
                      out.update(flatten(v, key))
              elif isinstance(value, str):
                  out[prefix] = value
              return out

          zhf, enf, ruf = flatten(zh), flatten(en), flatten(ru)
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          cyr = re.compile(r'[А-Яа-яЁё]')

          zh_pairs = {}
          en_pairs = {}
          for key, target in ruf.items():
              if not isinstance(target, str) or not target:
                  continue
              source_zh = zhf.get(key)
              if isinstance(source_zh, str) and source_zh != target and han.search(source_zh):
                  zh_pairs[source_zh] = target
              source_en = enf.get(key)
              if isinstance(source_en, str) and source_en != target and cyr.search(target) and len(source_en.strip()) >= 2:
                  en_pairs[source_en] = target

          quote_patterns = [
              ('\'', re.compile(r"'([^'\\n]*)'")),
              ('"', re.compile(r'"([^"\\n]*)"')),
              ('`', re.compile(r'`([^`\\n]*)`')),
          ]

          def replace_exact_quoted(text, mapping):
              hits = 0
              for quote, rx in quote_patterns:
                  def repl(m):
                      nonlocal hits
                      raw = m.group(1)
                      lead = raw[:len(raw) - len(raw.lstrip())]
                      trail = raw[len(raw.rstrip()):]
                      core = raw.strip()
                      target = mapping.get(core)
                      if target is None:
                          return m.group(0)
                      # Skip the extremely rare translation that would require changing
                      # quote syntax; it will be surfaced by the residual audit instead.
                      if quote in target or '\\' in target:
                          return m.group(0)
                      hits += 1
                      return quote + lead + target + trail + quote
                  text = rx.sub(repl, text)
              return text, hits

          text_node_rx = re.compile(r'>([^<>\n]+)<')
          visible_attr_rx = re.compile(
              r'(?P<name>\b(?:title|placeholder|aria-label|alt|label|tip))(?P<sep>\s*=\s*)(?P<q>["\'])(?P<value>[^"\']*)(?P=q)',
              re.I,
          )

          def replace_template_visible_english(template):
              hits = 0
              def text_repl(m):
                  nonlocal hits
                  raw = m.group(1)
                  core = raw.strip()
                  target = en_pairs.get(core)
                  if target is None:
                      return m.group(0)
                  lead = raw[:len(raw) - len(raw.lstrip())]
                  trail = raw[len(raw.rstrip()):]
                  hits += 1
                  return '>' + lead + target + trail + '<'
              template = text_node_rx.sub(text_repl, template)

              def attr_repl(m):
                  nonlocal hits
                  value = m.group('value').strip()
                  target = en_pairs.get(value)
                  if target is None or m.group('q') in target:
                      return m.group(0)
                  hits += 1
                  return f"{m.group('name')}{m.group('sep')}{m.group('q')}{target}{m.group('q')}"
              template = visible_attr_rx.sub(attr_repl, template)
              return template, hits

          exts = {'.vue', '.ts', '.tsx', '.js', '.jsx', '.html'}
          files = [p for p in Path('src').rglob('*') if p.is_file() and p.suffix in exts]
          if Path('index.html').exists(): files.append(Path('index.html'))

          changed = []
          zh_hits = 0
          en_hits = 0
          for path in sorted(set(files)):
              text = path.read_text(encoding='utf-8')
              original = text

              # Chinese: translate only complete string literal values.
              text, hits = replace_exact_quoted(text, zh_pairs)
              zh_hits += hits

              # Vue text nodes containing nothing but one complete donor phrase.
              if path.suffix == '.vue':
                  def zh_text_repl(m):
                      nonlocal_placeholder = None
                      raw = m.group(1)
                      core = raw.strip()
                      target = zh_pairs.get(core)
                      if target is None:
                          return m.group(0)
                      lead = raw[:len(raw) - len(raw.lstrip())]
                      trail = raw[len(raw.rstrip()):]
                      return '>' + lead + target + trail + '<'
                  before = text
                  text = text_node_rx.sub(zh_text_repl, text)
                  # Count isn't critical for correctness; quoted hits remain exact.
                  if text != before:
                      zh_hits += 1

                  # English donor strings are much more collision-prone. Restrict them to
                  # plain template text nodes and explicitly user-visible attributes only.
                  m = re.search(r'(<template\b[^>]*>)(.*?)(</template>)', text, flags=re.S)
                  if m:
                      translated, hits = replace_template_visible_english(m.group(2))
                      en_hits += hits
                      text = text[:m.start(2)] + translated + text[m.end(2):]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Browser-visible shell strings that are not part of Vue templates.
          index = Path('index.html')
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = re.sub(r'<html([^>]*)\blang=["\'][^"\']*["\']', r'<html\1lang="ru"', text, count=1)
              text = re.sub(
                  r'<meta name="description" content="[^"]*"\s*/?>',
                  '<meta name="description" content="PPTist — браузерный редактор презентаций с импортом, редактированием, показом и экспортом PPT." />',
                  text,
                  count=1,
              )
              text = re.sub(r'<title>.*?</title>', '<title>PPTist — редактор презентаций</title>', text, flags=re.S)
              text = text.replace('正在加载中，请稍等 ...', 'Загрузка, пожалуйста, подождите ...')
              index.write_text(text, encoding='utf-8')

          Path('.localization').mkdir(exist_ok=True)
          report = {
              'donor': 'robbin2012/PPTist-i18n',
              'strategy': 'exact string literals + exact template text + visible English attrs',
              'zh_ru_dictionary_entries': len(zh_pairs),
              'en_ru_dictionary_entries': len(en_pairs),
              'exact_chinese_hits': zh_hits,
              'exact_english_template_hits': en_hits,
              'files_changed': len(changed),
              'changed_files': changed,
          }
          Path('.localization/russianization-pass.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Re-audit residual visible strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          exts = {'.vue', '.ts', '.tsx', '.js', '.jsx', '.html'}
          files = [p for p in Path('src').rglob('*') if p.is_file() and p.suffix in exts]
          if Path('index.html').exists(): files.append(Path('index.html'))

          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          quoted = re.compile(r'''(?P<q>["'`])(?P<s>[^"'`\n]*[\u3400-\u4dbf\u4e00-\u9fff][^"'`\n]*)(?P=q)''')
          textnode = re.compile(r'>([^<>]*[\u3400-\u4dbf\u4e00-\u9fff][^<>]*)<')
          visible_attr = re.compile(r'''(?:title|placeholder|aria-label|alt|label|tip)\s*=\s*["']([^"']+)["']''', re.I)
          english_text = re.compile(r'>\s*([A-Za-z][A-Za-z0-9 /+&()_.:,!?#-]{2,})\s*<')

          residual_literals = []
          template_han = []
          english_candidates = []
          all_han_lines = []

          for path in sorted(set(files)):
              content = path.read_text(encoding='utf-8')
              in_template = False
              for lineno, line in enumerate(content.splitlines(), 1):
                  if '<template' in line: in_template = True
                  if han.search(line):
                      stripped = line.strip()
                      is_comment = stripped.startswith('//') or stripped.startswith('/*') or stripped.startswith('*') or stripped.startswith('<!--')
                      all_han_lines.append({'file': str(path), 'line': lineno, 'comment': is_comment, 'text': stripped})
                      for m in quoted.finditer(line):
                          residual_literals.append({'file': str(path), 'line': lineno, 'text': m.group('s').strip()})
                      if in_template and not is_comment:
                          for m in textnode.finditer(line):
                              template_han.append({'file': str(path), 'line': lineno, 'text': re.sub(r'\s+', ' ', m.group(1)).strip()})
                  if in_template:
                      for m in visible_attr.finditer(line):
                          value = m.group(1).strip()
                          if re.search(r'[A-Za-z]', value):
                              english_candidates.append({'file': str(path), 'line': lineno, 'kind': 'attr', 'text': value})
                      for m in english_text.finditer(line):
                          english_candidates.append({'file': str(path), 'line': lineno, 'kind': 'text', 'text': m.group(1).strip()})
                  if '</template>' in line: in_template = False

          def dedupe(items):
              seen = set(); out = []
              for item in items:
                  key = (item['file'], item['line'], item['text'])
                  if key not in seen and item['text']:
                      seen.add(key); out.append(item)
              return out

          residual_literals = dedupe(residual_literals)
          template_han = dedupe(template_han)
          english_candidates = dedupe(english_candidates)
          payload = {
              'stats': {
                  'han_lines_including_comments': len(all_han_lines),
                  'residual_chinese_string_literals': len(residual_literals),
                  'residual_chinese_template_text_nodes': len(template_han),
                  'english_visible_candidates': len(english_candidates),
              },
              'chinese_string_literals': residual_literals,
              'chinese_template_text_nodes': template_han,
              'english_visible_candidates': english_candidates,
              'all_han_lines': all_han_lines,
          }
          Path('.localization/residual-after-donor.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload['stats'], ensure_ascii=False, indent=2))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Production build
        run: npm run build-only -- --base=/PPTist/

      - name: Commit exact Russianization pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html .localization
          if git diff --cached --quiet; then
            echo 'No localization changes generated'
            exit 0
          fi
          git commit -m "feat: Russianize PPTist UI with exact-string translations"
          git push origin HEAD:${{ github.head_ref }}
